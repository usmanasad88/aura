# AURA Default Configuration
#
# All Pydantic model defaults live in src/aura/utils/config.py.
# Monitors, brain, actions, communication, and interface sections
# are configured via CLI args / task configs, not this file.

# Perception defaults (used by scripts/test_perception.py)
monitors:
  perception:
    enabled: true
    update_rate_hz: 10.0
    timeout_seconds: 2.0
    use_sam3: true
    use_gemini_detection: true
    max_objects: 10
    confidence_threshold: 0.5
    gemini_model: "gemini-3.1-pro-preview"
    default_prompts:
      - "person"
      - "hand"
    detection_interval_frames: 30

# Backend-specific defaults (keyed by llm_backend value)
backend_defaults:
  gemini:
    intent_max_tokens: 4096
    decision_max_tokens: 1024
  sglang:
    intent_max_tokens: 512
    decision_max_tokens: 512
  openai:
    intent_max_tokens: 1024
    decision_max_tokens: 1024
  vllm:
    intent_max_tokens: 1024
    decision_max_tokens: 1024
  ollama:
    intent_max_tokens: 1024
    decision_max_tokens: 1024

# Logging Configuration
logging:
  level: "INFO"
  log_to_file: true
  log_directory: "logs"
  max_log_size_mb: 100
  backup_count: 5
